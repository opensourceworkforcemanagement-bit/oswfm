# ============================================================================
# Password Security Configuration (OWASP Compliant)
# Add these to your application.properties
# ============================================================================

# Hashing Algorithm (BCRYPT, ARGON2, PBKDF2)
# BCRYPT: Good balance, widely supported
# ARGON2: Most secure, recommended for new systems
# PBKDF2: Good alternative, federal standard
security.password.algorithm=BCRYPT

# BCrypt strength (10-12 recommended by OWASP)
# Higher = more secure but slower
# 10 = ~100ms, 12 = ~400ms, 14 = ~1600ms
security.password.bcrypt-strength=12

# Argon2 parameters (if using ARGON2)
security.password.argon2-memory=65536
security.password.argon2-iterations=3
security.password.argon2-parallelism=1

# Password requirements
security.password.min-length=12
security.password.max-length=128
security.password.require-uppercase=true
security.password.require-lowercase=true
security.password.require-digits=true
security.password.require-special-chars=true

# Account lockout
security.password.enable-account-lockout=true
security.password.max-failed-attempts=5
security.password.lock-duration-minutes=30

# Password expiration
# 0 = never expires
# 90 = expires after 90 days (OWASP recommended for high security)
security.password.expiration-days=90

# Password history (prevent reuse)
security.password.password-history-count=5

# Minimum password age (prevent rapid changes)
security.password.min-password-age-hours=24

# Additional security checks
security.password.check-common-passwords=true
security.password.prevent-username-in-password=true
